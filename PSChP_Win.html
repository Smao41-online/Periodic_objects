<!DOCTYPE html>
<html lang="cs" data-default-lang="cs">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Periodická soustava chemických prvků (kompatibilní verze)</title>
<style>
/* Periodic Table — theme-aware styles.
   Category accents come from a CVD-validated categorical palette; every tile
   also carries a text label, so color never works alone. */

:root {
  --surface-1: #fcfcfb;
  --page: #f9f9f7;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #898781;
  --hairline: #e1e0d9;
  --ring: rgba(11, 11, 11, 0.10);
  --tint: 16%;            /* how strongly a tile is washed with its category hue */
  --tint-hover: 34%;

  --cat-alkali-metal: #e34948;
  --cat-alkaline-earth-metal: #eb6834;
  --cat-transition-metal: #2a78d6;
  --cat-post-transition-metal: #1baf7a;
  --cat-metalloid: #eda100;
  --cat-reactive-nonmetal: #008300;
  --cat-noble-gas: #4a3aa7;
  --cat-lanthanide: #e87ba4;
  --cat-actinide: #9085e9;
  --cat-unknown: #898781;

  --stable: #0ca30c;
  --stable-ink: #006300;

  /* decay-energy coding: α yellow, β blue, γ red, nucleon gray, stable white */
  --dk-a: #ffc400;
  --dk-b: #2a78d6;
  --dk-g: #e34948;
  --dk-n: #898781;
  --dk-sf: #52514e;
  --dk-stable-bg: #ffffff;
  --dk-stable-ink: #0b0b0b;
}

@media (prefers-color-scheme: dark) {
  :root {
    --surface-1: #1a1a19;
    --page: #0d0d0d;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted: #898781;
    --hairline: #2c2c2a;
    --ring: rgba(255, 255, 255, 0.10);
    --tint: 22%;
    --tint-hover: 40%;

    --cat-alkali-metal: #e66767;
    --cat-alkaline-earth-metal: #d95926;
    --cat-transition-metal: #3987e5;
    --cat-post-transition-metal: #199e70;
    --cat-metalloid: #c98500;
    --cat-noble-gas: #9085e9;
    --cat-actinide: #6d5fc9;
    --stable-ink: #0ca30c;
    --dk-a: #ffc21f;
    --dk-b: #3987e5;
    --dk-g: #e66767;
    --dk-sf: #c3c2b7;
    --dk-stable-bg: #f2f1ec;
    --dk-stable-ink: #0b0b0b;
  }
}
:root[data-theme="light"] {
  --surface-1: #fcfcfb; --page: #f9f9f7;
  --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #898781;
  --hairline: #e1e0d9; --ring: rgba(11,11,11,0.10);
  --tint: 16%; --tint-hover: 34%;
  --cat-alkali-metal: #e34948; --cat-alkaline-earth-metal: #eb6834;
  --cat-transition-metal: #2a78d6; --cat-post-transition-metal: #1baf7a;
  --cat-metalloid: #eda100; --cat-noble-gas: #4a3aa7; --cat-actinide: #9085e9;
  --stable: #0ca30c; --stable-ink: #006300;
  --dk-a: #ffc400; --dk-b: #2a78d6; --dk-g: #e34948; --dk-sf: #52514e;
  --dk-stable-bg: #ffffff; --dk-stable-ink: #0b0b0b;
}
:root[data-theme="dark"] {
  --surface-1: #1a1a19; --page: #0d0d0d;
  --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #898781;
  --hairline: #2c2c2a; --ring: rgba(255,255,255,0.10);
  --tint: 22%; --tint-hover: 40%;
  --cat-alkali-metal: #e66767; --cat-alkaline-earth-metal: #d95926;
  --cat-transition-metal: #3987e5; --cat-post-transition-metal: #199e70;
  --cat-metalloid: #c98500; --cat-noble-gas: #9085e9; --cat-actinide: #6d5fc9;
  --stable: #0ca30c; --stable-ink: #0ca30c;
  --dk-a: #ffc21f; --dk-b: #3987e5; --dk-g: #e66767; --dk-sf: #c3c2b7;
  --dk-stable-bg: #f2f1ec; --dk-stable-ink: #0b0b0b;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--page);
  color: var(--text-primary);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
}

.app { max-width: 1240px; margin: 0 auto; padding: 20px 16px 40px; }

.app-header {
  display: flex; flex-wrap: wrap; gap: 12px 24px;
  align-items: flex-end; justify-content: space-between;
  margin-bottom: 14px;
}
h1 { font-size: 1.45rem; margin: 0 0 4px; }
.subtitle { margin: 0; color: var(--text-secondary); font-size: 0.9rem; }

#search {
  width: 280px; max-width: 100%;
  padding: 8px 12px;
  border: 1px solid var(--hairline); border-radius: 8px;
  background: var(--surface-1); color: var(--text-primary);
  font-size: 0.9rem;
}
#search:focus { outline: 2px solid var(--cat-transition-metal); outline-offset: 1px; }

.controls { display: flex; align-items: center; gap: 8px; }
.lang-toggle {
  display: inline-flex; border: 1px solid var(--hairline); border-radius: 8px; overflow: hidden;
}
.lang-toggle button {
  border: none; background: transparent; color: var(--text-secondary);
  font: inherit; font-size: 0.78rem; font-weight: 600;
  padding: 7px 11px; cursor: pointer;
}
.lang-toggle button + button { border-left: 1px solid var(--hairline); }
.lang-toggle button:hover { color: var(--text-primary); }
.lang-toggle button[aria-pressed="true"] {
  background: color-mix(in srgb, var(--cat-transition-metal) 18%, var(--surface-1));
  color: var(--text-primary);
}

/* Legend — clickable category filter chips */
.legend { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.legend-chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px; border-radius: 999px;
  border: 1px solid var(--hairline);
  background: var(--surface-1); color: var(--text-secondary);
  font-size: 0.75rem; cursor: pointer;
}
.legend-chip .swatch {
  width: 10px; height: 10px; border-radius: 3px;
  background: var(--chip-color); box-shadow: inset 0 0 0 1px var(--ring);
}
.legend-chip:hover { color: var(--text-primary); }
.legend-chip[aria-pressed="true"] {
  background: color-mix(in srgb, var(--chip-color) 20%, var(--surface-1));
  border-color: var(--chip-color);
  color: var(--text-primary);
}

/* The table grid: 18 columns, 10 rows (row 8 is the f-block spacer) */
.table-scroll { overflow-x: auto; padding-bottom: 6px; }
.ptable {
  display: grid;
  grid-template-columns: repeat(18, minmax(56px, 1fr));
  grid-template-rows: repeat(7, minmax(62px, auto)) 18px repeat(2, minmax(62px, auto));
  gap: 4px;
  min-width: 1080px;
}
.ptable .spacer-row { grid-column: 1 / -1; height: 14px; }

.el {
  grid-column: var(--x); grid-row: var(--y);
  position: relative;
  display: flex; flex-direction: column; justify-content: center;
  padding: 4px 5px 5px;
  border: 1px solid var(--ring);
  border-radius: 6px;
  background: color-mix(in srgb, var(--cat) var(--tint), var(--surface-1));
  box-shadow: inset 0 -3px 0 var(--cat);
  color: var(--text-primary);
  font: inherit; text-align: left; cursor: pointer;
  transition: transform 0.08s ease, background 0.08s ease, opacity 0.15s ease;
}
.el:hover, .el:focus-visible {
  background: color-mix(in srgb, var(--cat) var(--tint-hover), var(--surface-1));
  transform: translateY(-2px);
  z-index: 2;
}
.el:focus-visible { outline: 2px solid var(--text-primary); outline-offset: 1px; }
.el.dimmed { opacity: 0.15; }

.el .num { font-size: 0.6rem; color: var(--text-secondary); line-height: 1; }
.el .sym { font-size: 1.05rem; font-weight: 700; line-height: 1.2; }
.el .name {
  font-size: 0.58rem; color: var(--text-secondary);
  line-height: 1.1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.el .mass { font-size: 0.55rem; color: var(--text-muted); line-height: 1.1; }

/* markers linking main table to the f-block rows */
.fmarker {
  grid-column: var(--x); grid-row: var(--y);
  display: flex; align-items: center; justify-content: center;
  border: 1px dashed var(--hairline); border-radius: 6px;
  color: var(--text-muted); font-size: 0.62rem;
}

.app-footer {
  margin-top: 18px; display: flex; flex-wrap: wrap; gap: 4px 18px;
  color: var(--text-muted); font-size: 0.72rem;
}
.app-footer a { color: var(--text-secondary); }

/* Detail dialog */
.detail {
  border: 1px solid var(--hairline); border-radius: 14px;
  background: var(--surface-1); color: var(--text-primary);
  padding: 0; max-width: 880px; width: 94%;
  max-height: 88vh;
}
.detail::backdrop { background: rgba(0, 0, 0, 0.45); }
.detail-inner { padding: 22px 24px 18px; }

.close-btn {
  position: absolute; top: 12px; right: 12px;
  border: 1px solid var(--hairline); border-radius: 8px;
  background: transparent; color: var(--text-secondary);
  width: 30px; height: 30px; cursor: pointer; font-size: 0.85rem;
}
.close-btn:hover { color: var(--text-primary); }

.detail-head { display: flex; gap: 16px; align-items: center; margin-bottom: 6px; }
.detail-tile {
  flex: none; width: 84px; height: 84px; border-radius: 10px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: color-mix(in srgb, var(--cat) 24%, var(--surface-1));
  box-shadow: inset 0 -4px 0 var(--cat), inset 0 0 0 1px var(--ring);
}
.detail-tile .sym { font-size: 1.9rem; font-weight: 700; line-height: 1; }
.detail-tile .num { font-size: 0.75rem; color: var(--text-secondary); margin-top: 4px; }
.detail-head h2 { margin: 0 0 6px; font-size: 1.5rem; }
#detail-body .cat-chip {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 0.72rem; color: var(--text-secondary);
  border: 1px solid var(--hairline); border-radius: 999px; padding: 3px 10px;
}
#detail-body .cat-chip .swatch {
  width: 9px; height: 9px; border-radius: 3px; background: var(--cat);
}

.detail-summary { color: var(--text-secondary); font-size: 0.86rem; line-height: 1.5; margin: 12px 0 14px; }

.props {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
  gap: 8px; margin-bottom: 12px;
}
.prop {
  border: 1px solid var(--hairline); border-radius: 8px; padding: 7px 10px;
}
.prop .k { font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); }
.prop .v { font-size: 0.85rem; margin-top: 2px; overflow-wrap: anywhere; }
.prop.wide { grid-column: 1 / -1; }

.shells { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 3px; }
.shell {
  border: 1px solid var(--hairline); border-radius: 6px;
  padding: 2px 7px; font-size: 0.75rem; color: var(--text-secondary);
}
.shell b { color: var(--text-primary); }

/* Isotopes section */
.iso-section { margin: 6px 0 12px; border-top: 1px solid var(--hairline); padding-top: 12px; }
.iso-section h3 { margin: 0 0 4px; font-size: 1.02rem; }
.iso-count { font-size: 0.72rem; font-weight: 400; color: var(--text-muted); margin-left: 6px; }
.iso-facts { margin: 0 0 2px; font-size: 0.78rem; color: var(--text-secondary); }
.iso-hint { margin: 0 0 8px; font-size: 0.7rem; color: var(--text-muted); }

.iso-scroll {
  max-height: 340px; overflow: auto;
  border: 1px solid var(--hairline); border-radius: 8px;
}
.iso-table { border-collapse: collapse; width: 100%; font-size: 0.76rem; }
.iso-table th {
  position: sticky; top: 0; z-index: 1;
  background: var(--surface-1); color: var(--text-muted);
  font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.04em;
  text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--hairline);
}
.iso-table td {
  padding: 5px 10px; border-bottom: 1px solid var(--hairline);
  white-space: nowrap; font-variant-numeric: tabular-nums;
}
.iso-table tbody tr:last-child td { border-bottom: none; }
.iso-table .nuc { font-weight: 600; }
.iso-table .mass { color: var(--text-secondary); }
.iso-row.radioactive { cursor: pointer; }
.iso-row.radioactive:hover td, .iso-row.radioactive:focus-visible td {
  background: color-mix(in srgb, var(--cat) 10%, transparent);
}

.stable-badge {
  display: inline-block; padding: 1px 8px; border-radius: 999px;
  font-size: 0.66rem; font-weight: 600;
  color: var(--stable-ink); background: color-mix(in srgb, var(--stable) 18%, transparent);
}
.isomer-badge {
  margin-left: 5px; padding: 0 5px; border-radius: 5px;
  font-size: 0.62rem; font-weight: 400; color: var(--text-muted);
  border: 1px solid var(--hairline);
}
.decay-chip {
  display: inline-block; margin-right: 4px; padding: 1px 7px;
  border: 1px solid var(--hairline); border-radius: 999px;
  font-size: 0.68rem; color: var(--text-secondary);
}
.ab .ab-bar {
  display: inline-block; vertical-align: middle;
  width: calc(var(--w) * 0.42); max-width: 42px; height: 7px;
  margin-right: 6px; border-radius: 3px;
  background: color-mix(in srgb, var(--cat) 65%, var(--surface-1));
}

/* Decay chain */
.chain-row > td { background: color-mix(in srgb, var(--cat) 5%, transparent); white-space: normal; }
.chain { display: flex; flex-wrap: wrap; align-items: center; gap: 5px 7px; padding: 4px 0; }
.chain-pill {
  display: inline-flex; flex-direction: column; align-items: center;
  padding: 3px 9px; border-radius: 8px;
  border: 1px solid var(--hairline); background: var(--surface-1);
}
.chain-pill b { font-size: 0.8rem; }
.chain-pill small { font-size: 0.6rem; color: var(--text-muted); }
.chain-pill.stable { border-color: var(--stable); box-shadow: inset 0 0 0 1px var(--stable); }
.chain-pill.fission { border-style: dashed; }
.chain-arrow { font-size: 0.7rem; color: var(--text-secondary); white-space: nowrap; }
.chain-note { font-size: 0.7rem; color: var(--text-secondary); padding: 2px 0 4px; }
.iso-src { margin: 8px 0 0; font-size: 0.66rem; color: var(--text-muted); }

/* Nuclide pop-up — enlarged view of one isotope and its decay chain */
.nuclide { max-width: 760px; width: 94%; }
.nuclide .detail-tile.nuclide-tile { width: auto; min-width: 110px; padding: 0 14px; }
.nuclide .detail-tile.nuclide-tile .sym { font-size: 1.7rem; }
.nuclide .detail-head h2 { font-size: 1.25rem; }
.nuclide h4 {
  margin: 16px 0 8px; font-size: 0.72rem;
  text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted);
}
.nuclide-props { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.big-badge { font-size: 0.8rem; padding: 3px 12px; }
.nuclide .cat-chip b { color: var(--text-primary); }

.decay-products { display: flex; flex-direction: column; gap: 6px; }
.decay-product { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

.chain-pill.clickable { cursor: pointer; }
.chain-pill.clickable:hover, .chain-pill.clickable:focus-visible {
  border-color: var(--cat, var(--text-muted));
  background: color-mix(in srgb, var(--cat, var(--text-muted)) 12%, var(--surface-1));
}
.chain-pill.clickable:focus-visible { outline: 2px solid var(--text-primary); outline-offset: 1px; }

/* enlarged chain inside the pop-up */
.chain.big { gap: 8px 10px; padding: 6px 0; }
.chain.big .chain-pill { padding: 7px 14px; border-radius: 10px; }
.chain.big .chain-pill b { font-size: 1.05rem; }
.chain.big .chain-pill small { font-size: 0.72rem; }
.chain.big .chain-arrow { font-size: 0.85rem; }

.nuclide-foot { margin-top: 16px; display: flex; justify-content: flex-end; }

/* decay-energy pill coloring (α yellow, β blue, γ red, n/p gray, stable white) */
.chain-pill.dk-a { background: color-mix(in srgb, var(--dk-a) 42%, var(--surface-1)); border-color: var(--dk-a); }
.chain-pill.dk-b { background: color-mix(in srgb, var(--dk-b) 26%, var(--surface-1)); border-color: var(--dk-b); }
.chain-pill.dk-g { background: color-mix(in srgb, var(--dk-g) 26%, var(--surface-1)); border-color: var(--dk-g); }
.chain-pill.dk-n { background: color-mix(in srgb, var(--dk-n) 26%, var(--surface-1)); border-color: var(--dk-n); }
.chain-pill.dk-sf { border-color: var(--dk-sf); }
.chain-pill.dk-stable {
  background: var(--dk-stable-bg); color: var(--dk-stable-ink);
}
.chain-pill.dk-stable small { color: var(--stable-ink); font-weight: 600; }

/* color legend */
.dk-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 0 0 10px; }
.dk-legend-item { display: inline-flex; align-items: center; gap: 6px; font-size: 0.7rem; color: var(--text-secondary); }
.dk-swatch {
  display: inline-flex; align-items: center; justify-content: center;
  width: 18px; height: 18px; border-radius: 5px;
  font-size: 0.62rem; font-weight: 700; color: var(--text-primary);
  border: 1px solid var(--hairline);
}
.dk-swatch.dk-a { background: color-mix(in srgb, var(--dk-a) 42%, var(--surface-1)); border-color: var(--dk-a); }
.dk-swatch.dk-b { background: color-mix(in srgb, var(--dk-b) 26%, var(--surface-1)); border-color: var(--dk-b); }
.dk-swatch.dk-g { background: color-mix(in srgb, var(--dk-g) 26%, var(--surface-1)); border-color: var(--dk-g); }
.dk-swatch.dk-n { background: color-mix(in srgb, var(--dk-n) 26%, var(--surface-1)); border-color: var(--dk-n); }
.dk-swatch.dk-stable { background: var(--dk-stable-bg); color: var(--dk-stable-ink); border-color: var(--stable); }
.dk-swatch.dk-sf { border-style: dashed; border-color: var(--dk-sf); }

/* branch-arm weight: connector thickness + emphasis mirror intensity */
.decay-tree li.w-main::before, .decay-tree li.w-main::after { border-width: 0 0 3px 3px; }
.decay-tree li.w-main::after { border-width: 0 0 0 3px; }
.decay-tree li.w-min { opacity: 0.78; }
.decay-tree li.w-min::before, .decay-tree li.w-min::after { border-style: dashed; }
.tree-node.w-min .decay-chip { border-style: dashed; }
.tree-node.w-main .decay-chip { font-weight: 600; }

/* Σ half-lives to stability */
.sum-chip {
  font-size: 0.66rem; color: var(--stable-ink);
  border: 1px dashed var(--stable); border-radius: 999px; padding: 2px 8px;
  white-space: nowrap; cursor: help;
}

/* tree header with threshold selector */
.tree-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.tree-threshold {
  font-size: 0.7rem; color: var(--text-muted);
  display: inline-flex; align-items: center; gap: 6px;
}
.tree-threshold select {
  font: inherit; font-size: 0.74rem; color: var(--text-primary);
  background: var(--surface-1); border: 1px solid var(--hairline);
  border-radius: 6px; padding: 3px 6px;
}

/* Branching decay tree in the nuclide pop-up */
.tree-note { margin: -4px 0 10px; font-size: 0.7rem; color: var(--text-muted); }
.decay-tree { overflow-x: auto; padding-bottom: 4px; }
.decay-tree > .chain-pill { margin-bottom: 2px; }
.decay-tree .chain-pill { padding: 6px 13px; border-radius: 10px; }
.decay-tree .chain-pill b { font-size: 1rem; }
.decay-tree .chain-pill small { font-size: 0.7rem; }
.decay-tree ul {
  list-style: none; margin: 0; padding: 0 0 0 26px;
}
.decay-tree li { position: relative; padding: 8px 0 0 20px; }
/* elbow ├ / └ connectors drawn with borders */
.decay-tree li::before {
  content: ''; position: absolute; left: 0; top: 0;
  width: 16px; height: 30px;
  border-left: 2px solid var(--hairline);
  border-bottom: 2px solid var(--hairline);
  border-bottom-left-radius: 8px;
}
.decay-tree li::after {
  content: ''; position: absolute; left: 0; top: 30px; bottom: 0;
  border-left: 2px solid var(--hairline);
}
.decay-tree li:last-child::after { display: none; }
.tree-node { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.tree-arrow { color: var(--text-secondary); font-size: 0.85rem; }
/* a linear run: sequential decays stacked at one indent level */
.tree-run { display: flex; flex-direction: column; gap: 8px; position: relative; }
.tree-run .tree-node + .tree-node { position: relative; padding-left: 18px; }
.tree-run .tree-node + .tree-node::before {
  content: ''; position: absolute; left: 4px; top: -22px; width: 12px; height: 36px;
  border-left: 2px solid var(--hairline);
  border-bottom: 2px solid var(--hairline);
  border-bottom-left-radius: 8px;
}

.detail-src { font-size: 0.72rem; color: var(--text-muted); }
.detail-src a { color: var(--text-secondary); }

.detail-nav { display: flex; justify-content: space-between; margin-top: 14px; }
.nav-btn {
  border: 1px solid var(--hairline); border-radius: 8px;
  background: transparent; color: var(--text-secondary);
  padding: 6px 14px; font-size: 0.8rem; cursor: pointer;
}
.nav-btn:hover:not(:disabled) { color: var(--text-primary); border-color: var(--text-muted); }
.nav-btn:disabled { opacity: 0.35; cursor: default; }

@media (max-width: 720px) {
  .el .mass { display: none; }
  .ptable { min-width: 940px; grid-template-columns: repeat(18, minmax(48px, 1fr)); grid-auto-rows: minmax(54px, auto); }
}


/* ---- Legacy-browser fallback: static colors when color-mix() is unsupported.

    5: ['Bor', 'Bor je chemický prvek se značkou B a protonovým číslem 5. Vznikl výhradně spalací kosmickým zářením, a proto je ve sluneční soustavě vzácný. Na Zemi se koncentruje ve vodorozpustných boritanových minerálech, jako je borax.', 'Bor (prvek)'],
    6: ['Uhlík', 'Uhlík je chemický prvek se značkou C a protonovým číslem 6. Je nekovový, čtyřvazný — vytváří čtyři elektrony pro kovalentní vazby. V přírodě se vyskytují tři izotopy: ¹²C a ¹³C jsou stabilní, radioaktivní ¹⁴C se rozpadá s poločasem asi 5 730 let. Uhlík je jedním z mála prvků známých od starověku.'],
    7: ['Dusík', 'Dusík je chemický prvek se značkou N a protonovým číslem 7. Poprvé jej roku 1772 objevil a izoloval skotský lékař Daniel Rutherford. Za normálních podmínek tvoří dvouatomový plyn N₂, který tvoří asi 78 % zemské atmosféry.'],
    8: ['Kyslík', 'Kyslík je chemický prvek se značkou O a protonovým číslem 8. Patří do skupiny chalkogenů, je vysoce reaktivním nekovem a silným oxidačním činidlem, které snadno tvoří oxidy s většinou prvků. Po vodíku a heliu je třetím nejrozšířenějším prvkem ve vesmíru.'],
    9: ['Fluor', 'Fluor je chemický prvek se značkou F a protonovým číslem 9. Je to nejlehčí halogen a za standardních podmínek existuje jako vysoce toxický, světle žlutý dvouatomový plyn. Jako elektronegativně nejsilnější prvek je mimořádně reaktivní a reaguje téměř se všemi ostatními prvky.'],
    10: ['Neon', 'Neon je chemický prvek se značkou Ne a protonovým číslem 10. Patří mezi vzácné plyny; za standardních podmínek je to bezbarvý inertní jednoatomový plyn bez zápachu, s hustotou asi dvou třetin hustoty vzduchu.'],
    11: ['Sodík', 'Sodík je chemický prvek se značkou Na (z latinského natrium) a protonovým číslem 11. Je to měkký, stříbřitě bílý, vysoce reaktivní alkalický kov s jediným stabilním izotopem ²³Na. Volný kov se v přírodě nevyskytuje a musí se vyrábět ze sloučenin.'],
    12: ['Hořčík', 'Hořčík je chemický prvek se značkou Mg a protonovým číslem 12. Je to lesklý šedý kov, který se v periodické tabulce podobá ostatním pěti prvkům druhé skupiny: všechny mají stejnou elektronovou konfiguraci vnější slupky a podobnou krystalovou strukturu.'],
    13: ['Hliník', 'Hliník je chemický prvek se značkou Al a protonovým číslem 13. Je to stříbřitě bílý, měkký, nemagnetický, tažný kov ze skupiny boru. Tvoří asi 8 % hmotnosti zemské kůry a je tak jejím třetím nejrozšířenějším prvkem po kyslíku a křemíku.'],
    14: ['Křemík', 'Křemík je chemický prvek se značkou Si a protonovým číslem 14. Je to tvrdý a křehký krystalický polokov s modrošedým kovovým leskem, čtyřvazný. Je poměrně nereaktivní, ale má velkou chemickou afinitu ke kyslíku.'],
    15: ['Fosfor', 'Fosfor je chemický prvek se značkou P a protonovým číslem 15. Jako vysoce reaktivní prvek se fosfor v přírodě nikdy nevyskytuje volný. Existuje ve dvou hlavních formách — bílý a červený fosfor.'],
    16: ['Síra', 'Síra je chemický prvek se značkou S a protonovým číslem 16. Je hojná, mnohomocná a nekovová. Za normálních podmínek tvoří cyklické osmiatomové molekuly S₈ a je to jasně žlutá krystalická pevná látka.'],
    17: ['Chlor', 'Chlor je chemický prvek se značkou Cl a protonovým číslem 17. Je druhým nejlehčím halogenem; v periodické tabulce stojí mezi fluorem a bromem a jeho vlastnosti jsou většinou přechodné mezi nimi. Za pokojové teploty je to žlutozelený plyn.'],
    18: ['Argon', 'Argon je chemický prvek se značkou Ar a protonovým číslem 18. Patří do 18. skupiny periodické tabulky mezi vzácné plyny. Je třetím nejrozšířenějším plynem zemské atmosféry (0,934 %) — je jí více než dvakrát tolik co vodní páry.'],
    19: ['Draslík', 'Draslík je chemický prvek se značkou K (z latinského kalium) a protonovým číslem 19. Byl poprvé izolován z potaše, popela rostlin, z čehož pochází jeho anglický název. Je to stříbřitě bílý alkalický kov, který se na vzduchu rychle pokrývá vrstvou oxidu.'],
    20: ['Vápník', 'Vápník je chemický prvek se značkou Ca a protonovým číslem 20. Je to kov alkalických zemin, pátý nejrozšířenější prvek zemské kůry. Volný vápník je vzácný, protože je velmi reaktivní; vyskytuje se hlavně ve vápenci a sádrovci.'],
    21: ['Skandium', 'Skandium je chemický prvek se značkou Sc a protonovým číslem 21. Je to stříbřitě bílý přechodný kov, historicky řazený mezi prvky vzácných zemin společně s yttriem a lanthanoidy. Objeveno bylo roku 1879 spektrální analýzou minerálů euxenitu a gadolinitu ve Skandinávii.'],
    22: ['Titan', 'Titan je chemický prvek se značkou Ti a protonovým číslem 22. Je to lesklý přechodný kov stříbrné barvy, s malou hustotou a vysokou pevností. Odolává korozi v mořské vodě, lučavce královské i chloru.', 'Titan (prvek)'],
    23: ['Vanad', 'Vanad je chemický prvek se značkou V a protonovým číslem 23. Je to tvrdý, stříbřitě šedý, tažný a kujný přechodný kov. V přírodě se volný téměř nevyskytuje; po umělé izolaci jej vrstvička oxidu chrání před další oxidací.'],
    24: ['Chrom', 'Chrom je chemický prvek se značkou Cr a protonovým číslem 24. Je prvním prvkem 6. skupiny. Je to ocelově šedý, lesklý, tvrdý a křehký kov, který se dá vysoce vyleštit, špatně se taví a má vysokou teplotu varu.'],
    25: ['Mangan', 'Mangan je chemický prvek se značkou Mn a protonovým číslem 25. V přírodě se nevyskytuje jako volný kov; často se nachází v minerálech spolu se železem. Jako průmyslový legující kov má mnoho využití, zejména v nerezových ocelích.'],
    26: ['Železo', 'Železo je chemický prvek se značkou Fe (z latinského ferrum) a protonovým číslem 26. Je to kov první přechodné řady. Hmotnostně je nejrozšířenějším prvkem na Zemi — tvoří velkou část vnějšího i vnitřního zemského jádra.'],
    27: ['Kobalt', 'Kobalt je chemický prvek se značkou Co a protonovým číslem 27. Podobně jako nikl se v zemské kůře vyskytuje volný jen v meteorickém železe. Volný kobalt vyrobený redukčním tavením je tvrdý, lesklý, stříbřitě šedý kov.'],
    28: ['Nikl', 'Nikl je chemický prvek se značkou Ni a protonovým číslem 28. Je to stříbřitě bílý lesklý kov s lehce zlatavým nádechem. Patří mezi přechodné kovy, je tvrdý a tažný.'],
    29: ['Měď', 'Měď je chemický prvek se značkou Cu (z latinského cuprum) a protonovým číslem 29. Je to měkký, kujný a tažný kov s velmi vysokou tepelnou a elektrickou vodivostí. Čerstvě obnažený povrch má růžovooranžovou barvu.'],
    30: ['Zinek', 'Zinek je chemický prvek se značkou Zn a protonovým číslem 30. Je prvním prvkem 12. skupiny periodické tabulky. V některých ohledech se chemicky podobá hořčíku: oba kovy mají jediné běžné oxidační číslo +2 a ionty Zn²⁺ a Mg²⁺ jsou podobně velké.'],
    31: ['Gallium', 'Gallium je chemický prvek se značkou Ga a protonovým číslem 31. Roku 1875 jej objevil francouzský chemik Paul Émile Lecoq de Boisbaudran. Patří do 13. skupiny a podobá se ostatním jejím kovům — hliníku, indiu a thalliu.'],
    32: ['Germanium', 'Germanium je chemický prvek se značkou Ge a protonovým číslem 32. Je to lesklý, tvrdý, šedobílý polokov ze skupiny uhlíku, chemicky podobný sousednímu cínu a křemíku. Čisté germanium je polovodič vzhledem podobný křemíku.'],
    33: ['Arsen', 'Arsen je chemický prvek se značkou As a protonovým číslem 33. Vyskytuje se v mnoha minerálech, obvykle spolu se sírou a kovy, ale i jako ryzí prvek. Arsen je polokov a má různé alotropy; stabilní je pouze šedá forma důležitá pro průmysl.'],
    34: ['Selen', 'Selen je chemický prvek se značkou Se a protonovým číslem 34. Je to nekov s vlastnostmi mezi sírou a tellurem, prvky nad ním a pod ním v periodické tabulce; zřídka se v přírodě vyskytuje ryzí.'],
    35: ['Brom', 'Brom je chemický prvek se značkou Br a protonovým číslem 35. Je to halogen a za pokojové teploty třetí nejlehčí prvek své skupiny — dýmavá červenohnědá kapalina, která se snadno vypařuje a tvoří podobně zbarvený plyn.'],
    36: ['Krypton', 'Krypton je chemický prvek se značkou Kr a protonovým číslem 36. Je to bezbarvý vzácný plyn bez chuti a zápachu, který se ve stopovém množství vyskytuje v atmosféře a často se používá spolu s dalšími vzácnými plyny v zářivkách.'],
    37: ['Rubidium', 'Rubidium je chemický prvek se značkou Rb a protonovým číslem 37. Je to měkký, stříbřitě bílý kov ze skupiny alkalických kovů. Kovové rubidium má vlastnosti podobné draslíku i cesiu.'],
    38: ['Stroncium', 'Stroncium je chemický prvek se značkou Sr a protonovým číslem 38. Je to kov alkalických zemin, měkký stříbřitě bílý či nažloutlý kovový prvek, chemicky vysoce reaktivní. Na vzduchu se čerstvý povrch rychle zbarvuje dožluta.'],
    39: ['Yttrium', 'Yttrium je chemický prvek se značkou Y a protonovým číslem 39. Je to stříbřitě kovový přechodný prvek, chemicky podobný lanthanoidům; často bývá řazen mezi prvky vzácných zemin.'],
    40: ['Zirkonium', 'Zirkonium je chemický prvek se značkou Zr a protonovým číslem 40. Název pochází od minerálu zirkonu, nejdůležitějšího zdroje zirkonia. Je to lesklý, šedobílý, pevný přechodný kov podobný hafniu a v menší míře titanu.'],
    41: ['Niob', 'Niob je chemický prvek se značkou Nb a protonovým číslem 41. Je to měkký, šedý, tažný přechodný kov, často se vyskytující v minerálech pyrochloru a kolumbitu. Jméno pochází z řecké mytologie — Niobé byla dcerou Tantala.'],
    42: ['Molybden', 'Molybden je chemický prvek se značkou Mo a protonovým číslem 42. Název pochází z novolatinského molybdaenum, z řeckého molybdos (olovo), protože jeho rudy byly zaměňovány s olověnými. Volný kov je stříbřitě šedý a patří k nejtvrdším.'],
    43: ['Technecium', 'Technecium je chemický prvek se značkou Tc a protonovým číslem 43. Je to nejlehčí prvek, jehož všechny izotopy jsou radioaktivní; žádný není stabilní. Téměř veškeré technecium se vyrábí synteticky a jen nepatrné množství se nachází v přírodě.'],
    44: ['Ruthenium', 'Ruthenium je chemický prvek se značkou Ru a protonovým číslem 44. Je to vzácný přechodný kov ze skupiny platinových kovů. Podobně jako ostatní kovy této skupiny je vůči většině chemikálií inertní.'],
    45: ['Rhodium', 'Rhodium je chemický prvek se značkou Rh a protonovým číslem 45. Je to mimořádně vzácný, korozivzdorný, stříbřitě bílý tvrdý přechodný kov a ušlechtilý kov ze skupiny platinových kovů. Má jediný přírodní izotop ¹⁰³Rh.'],
    46: ['Palladium', 'Palladium je chemický prvek se značkou Pd a protonovým číslem 46. Je to vzácný, lesklý, stříbřitě bílý kov, objevený roku 1803 Williamem Hydem Wollastonem, pojmenovaný po asteroidu Pallas.'],
    47: ['Stříbro', 'Stříbro je chemický prvek se značkou Ag (z latinského argentum) a protonovým číslem 47. Je to měkký, bílý, lesklý přechodný kov s nejvyšší elektrickou i tepelnou vodivostí a odrazivostí ze všech kovů.'],
    48: ['Kadmium', 'Kadmium je chemický prvek se značkou Cd a protonovým číslem 48. Tento měkký, modrobílý kov je chemicky podobný dvěma dalším stabilním kovům 12. skupiny — zinku a rtuti.'],
    49: ['Indium', 'Indium je chemický prvek se značkou In a protonovým číslem 49. Je to nepřechodný kov tvořící 0,21 ppm zemské kůry. Je velmi měkký a tažný; ohýbaná tyčinka india vydává charakteristický „pláč“.'],
    50: ['Cín', 'Cín je chemický prvek se značkou Sn (z latinského stannum) a protonovým číslem 50. Je prvkem 14. skupiny. Získává se především z minerálu kassiteritu, který obsahuje oxid cíničitý SnO₂.'],
    51: ['Antimon', 'Antimon je chemický prvek se značkou Sb (z latinského stibium) a protonovým číslem 51. Je to lesklý šedý polokov, který se v přírodě vyskytuje hlavně jako sulfidový minerál antimonit (stibnit). Sloučeniny antimonu byly známy již ve starověku.'],
    52: ['Tellur', 'Tellur je chemický prvek se značkou Te a protonovým číslem 52. Je to křehký, mírně toxický, vzácný polokov stříbřitě bílé barvy. Chemicky je příbuzný selenu a síře. Občas se vyskytuje ryzí, častěji jako sloučeniny se zlatem.'],
    53: ['Jod', 'Jod je chemický prvek se značkou I a protonovým číslem 53. Je to nejtěžší ze stabilních halogenů; za standardních podmínek tvoří lesklou purpurově černou nekovou pevnou látku, která taje na sytě fialovou kapalinu při 114 °C.'],
    54: ['Xenon', 'Xenon je chemický prvek se značkou Xe a protonovým číslem 54. Je to bezbarvý, hustý vzácný plyn bez zápachu, který se v zemské atmosféře vyskytuje jen ve stopovém množství. Přestože je obecně nereaktivní, může podstoupit několik chemických reakcí.'],
    55: ['Cesium', 'Cesium je chemický prvek se značkou Cs a protonovým číslem 55. Je to měkký, stříbřitě zlatý alkalický kov s teplotou tání 28,5 °C — jeden z pouhých pěti prvků, které jsou kapalné blízko pokojové teploty.'],
    56: ['Baryum', 'Baryum je chemický prvek se značkou Ba a protonovým číslem 56. Je pátým prvkem 2. skupiny, měkký, stříbřitý kov alkalických zemin. Kvůli vysoké chemické reaktivitě se v přírodě nikdy nevyskytuje volné.'],
    57: ['Lanthan', 'Lanthan je chemický prvek se značkou La a protonovým číslem 57. Je to měkký, tažný, stříbřitě bílý kov, který na vzduchu pomalu matní a je tak měkký, že se dá krájet nožem. Dal jméno celé skupině lanthanoidů.'],
    58: ['Cer', 'Cer je chemický prvek se značkou Ce a protonovým číslem 58. Je to měkký, stříbřitý, tažný kov, který snadno reaguje se vzduchem. Je nejrozšířenějším prvkem vzácných zemin — tvoří asi 0,0046 % hmotnosti zemské kůry.'],
    59: ['Praseodym', 'Praseodym je chemický prvek se značkou Pr a protonovým číslem 59. Je třetím členem řady lanthanoidů a tradičně se počítá mezi kovy vzácných zemin. Je to měkký, stříbřitý, kujný a tažný kov, ceněný pro své magnetické, elektrické, chemické a optické vlastnosti.'],
    60: ['Neodym', 'Neodym je chemický prvek se značkou Nd a protonovým číslem 60. Je to měkký, stříbřitý kov ze skupiny lanthanoidů, který na vzduchu matní. Objeven byl roku 1885 rakouským chemikem Carlem Auerem von Welsbach.'],
    61: ['Promethium', 'Promethium je chemický prvek se značkou Pm a protonovým číslem 61. Všechny jeho izotopy jsou radioaktivní; je mimořádně vzácné — v zemské kůře se v daném okamžiku přirozeně vyskytuje jen asi 500–600 gramů.'],
    62: ['Samarium', 'Samarium je chemický prvek se značkou Sm a protonovým číslem 62. Je to středně tvrdý stříbřitý kov, který na vzduchu pomalu oxiduje. Jako typický lanthanoid má obvykle oxidační číslo +3.'],
    63: ['Europium', 'Europium je chemický prvek se značkou Eu a protonovým číslem 63. Bylo objeveno roku 1901 a pojmenováno po kontinentu Evropa. Je to středně tvrdý stříbřitý kov, který snadno oxiduje na vzduchu i ve vodě.'],
    64: ['Gadolinium', 'Gadolinium je chemický prvek se značkou Gd a protonovým číslem 64. Je to stříbřitě bílý, kujný a tažný kov vzácných zemin. V přírodě se vyskytuje pouze v oxidované formě.'],
    65: ['Terbium', 'Terbium je chemický prvek se značkou Tb a protonovým číslem 65. Je to stříbřitě bílý kov vzácných zemin, kujný, tažný a dost měkký na to, aby se dal krájet nožem. Volné terbium se v přírodě nevyskytuje.'],
    66: ['Dysprosium', 'Dysprosium je chemický prvek se značkou Dy a protonovým číslem 66. Je to prvek vzácných zemin s kovovým stříbrným leskem. V přírodě se nikdy nevyskytuje volné, nachází se v minerálech jako xenotim.'],
    67: ['Holmium', 'Holmium je chemický prvek se značkou Ho a protonovým číslem 67. Patří do řady lanthanoidů a je prvkem vzácných zemin. Je to poměrně měkký a kujný stříbřitě bílý kov.'],
    68: ['Erbium', 'Erbium je chemický prvek se značkou Er a protonovým číslem 68. Je to stříbřitě bílý pevný kov ze skupiny lanthanoidů; v přírodě se vyskytuje vždy ve sloučeninách s dalšími prvky.'],
    69: ['Thulium', 'Thulium je chemický prvek se značkou Tm a protonovým číslem 69. Je třináctým a třetím posledním prvkem řady lanthanoidů. Podobně jako ostatní lanthanoidy má nejběžnější oxidační číslo +3.'],
    70: ['Ytterbium', 'Ytterbium je chemický prvek se značkou Yb a protonovým číslem 70. Je čtrnáctým a předposledním prvkem řady lanthanoidů, což je základ jeho relativní stability — obvykle má oxidační číslo +3.'],
    71: ['Lutecium', 'Lutecium je chemický prvek se značkou Lu a protonovým číslem 71. Je to stříbřitě bílý kov, který na suchém vzduchu odolává korozi, na vlhkém nikoli. Je posledním prvkem řady lanthanoidů.'],
    72: ['Hafnium', 'Hafnium je chemický prvek se značkou Hf a protonovým číslem 72. Je to lesklý, stříbřitě šedý, čtyřmocný přechodný kov, chemicky podobný zirkoniu, s nímž se nachází ve stejných minerálech.'],
    73: ['Tantal', 'Tantal je chemický prvek se značkou Ta a protonovým číslem 73. Dříve znám jako tantalium, pojmenován je po Tantalovi z řecké mytologie. Je to vzácný, tvrdý, modrošedý lesklý přechodný kov, vysoce odolný proti korozi.'],
    74: ['Wolfram', 'Wolfram je chemický prvek se značkou W a protonovým číslem 74. Je to vzácný kov, který se v přírodě na Zemi vyskytuje téměř výhradně ve sloučeninách. Byl identifikován jako nový prvek roku 1781 a poprvé izolován roku 1783.'],
    75: ['Rhenium', 'Rhenium je chemický prvek se značkou Re a protonovým číslem 75. Je to stříbřitě bílý, těžký přechodný kov třetí řady v 7. skupině. S odhadovanou koncentrací 1 ppb patří k nejvzácnějším prvkům zemské kůry.'],
    76: ['Osmium', 'Osmium je chemický prvek se značkou Os a protonovým číslem 76. Je to tvrdý, křehký, modrobílý přechodný kov ze skupiny platinových kovů, v přírodě nejčastěji jako stopová příměs v platinových rudách. Je to prvek s nejvyšší hustotou.'],
    77: ['Iridium', 'Iridium je chemický prvek se značkou Ir a protonovým číslem 77. Je to velmi tvrdý, křehký, stříbřitě bílý přechodný kov ze skupiny platinových kovů, druhý nejhustší prvek. Je také nejodolnějším kovem proti korozi, a to i při 2000 °C.'],
    78: ['Platina', 'Platina je chemický prvek se značkou Pt a protonovým číslem 78. Je to hustý, kujný, tažný, vysoce nereaktivní, vzácný, stříbřitě bílý ušlechtilý kov. Její název pochází ze španělského platina — „stříbříčko“.'],
    79: ['Zlato', 'Zlato je chemický prvek se značkou Au (z latinského aurum) a protonovým číslem 79. V čisté formě je to lesklý, načervenale žlutý, hustý, měkký, kujný a tažný kov. Chemicky patří mezi přechodné kovy 11. skupiny.'],
    80: ['Rtuť', 'Rtuť je chemický prvek se značkou Hg (z latinizovaného řeckého hydrargyrum) a protonovým číslem 80. Je jediným kovovým prvkem, který je za standardních podmínek kapalný; jediným dalším kapalným prvkem je brom.'],
    81: ['Thallium', 'Thallium je chemický prvek se značkou Tl a protonovým číslem 81. Je to šedý nepřechodný kov, který se v přírodě nevyskytuje volný. Roku 1861 jej nezávisle objevili William Crookes a Claude-Auguste Lamy v usazeninách z výroby kyseliny sírové.'],
    82: ['Olovo', 'Olovo je chemický prvek se značkou Pb (z latinského plumbum) a protonovým číslem 82. Je to těžký kov, hustší než většina běžných materiálů; je měkké, kujné a má poměrně nízkou teplotu tání.'],
    83: ['Bismut', 'Bismut je chemický prvek se značkou Bi a protonovým číslem 83. Je to pětimocný nepřechodný kov chemicky podobný arsenu a antimonu. Elementární bismut se může vyskytovat i ryzí, i když je vzácnější než jeho sulfidové a oxidové rudy.'],
    84: ['Polonium', 'Polonium je chemický prvek se značkou Po a protonovým číslem 84. Objevili jej roku 1898 Marie a Pierre Curieovi. Je to vzácný a vysoce radioaktivní kov bez stabilních izotopů, chemicky podobný bismutu a telluru.'],
    85: ['Astat', 'Astat je chemický prvek se značkou At a protonovým číslem 85. Je to nejvzácnější přirozeně se vyskytující prvek zemské kůry — vzniká pouze rozpadem těžších prvků. Všechny izotopy astatu mají krátký poločas; nejstabilnější je ²¹⁰At s poločasem 8,1 hodiny.'],
    86: ['Radon', 'Radon je chemický prvek se značkou Rn a protonovým číslem 86. Je to radioaktivní, bezbarvý vzácný plyn bez chuti a zápachu. Vzniká jako mezistupeň v rozpadových řadách, kterými se thorium a uran pomalu mění v olovo.'],
    87: ['Francium', 'Francium je chemický prvek se značkou Fr a protonovým číslem 87. Dříve byl znám jako eka-cesium. Je mimořádně radioaktivní; jeho nejstabilnější izotop ²²³Fr má poločas pouze 22 minut.'],
    88: ['Radium', 'Radium je chemický prvek se značkou Ra a protonovým číslem 88. Je šestým prvkem 2. skupiny, mezi kovy alkalických zemin. Čisté radium je stříbřitě bílé, ale na vzduchu snadno reaguje s dusíkem a černá.'],
    89: ['Aktinium', 'Aktinium je chemický prvek se značkou Ac a protonovým číslem 89. Roku 1899 jej objevil André-Louis Debierne a nezávisle na něm roku 1902 Friedrich Oskar Giesel. Bylo jedním z prvních objevených neprimordiálních radioaktivních prvků a dalo jméno celé řadě aktinoidů.'],
    90: ['Thorium', 'Thorium je chemický prvek se značkou Th a protonovým číslem 90. Je to radioaktivní aktinoid; jde o jeden z pouhých dvou výrazně radioaktivních prvků, které se v přírodě vyskytují ve velkém množství jako primordialní prvky (druhým je uran).'],
    91: ['Protaktinium', 'Protaktinium je chemický prvek se značkou Pa a protonovým číslem 91. Je to hustý, stříbřitě šedý aktinoid, který snadno reaguje s kyslíkem, vodní párou a anorganickými kyselinami.'],
    92: ['Uran', 'Uran je chemický prvek se značkou U a protonovým číslem 92. Je to stříbřitě šedý kov z řady aktinoidů. Atom uranu má 92 protonů a 92 elektronů, z toho 6 valenčních. Přírodní uran tvoří převážně izotop ²³⁸U s příměsí ²³⁵U.', 'Uran (prvek)'],
    93: ['Neptunium', 'Neptunium je chemický prvek se značkou Np a protonovým číslem 93. Je to radioaktivní aktinoidový kov, první transuranový prvek. Jeho pozice v periodické tabulce hned za uranem, pojmenovaným po planetě Uran, mu vynesla jméno po planetě Neptun.'],
    94: ['Plutonium', 'Plutonium je chemický prvek se značkou Pu a protonovým číslem 94. Je to radioaktivní aktinoidový kov stříbřitě šedého vzhledu, který na vzduchu matní a v oxidované formě se pokrývá matným povlakem.'],
    95: ['Americium', 'Americium je chemický prvek se značkou Am a protonovým číslem 95. Je to radioaktivní transuranový prvek z řady aktinoidů, pojmenovaný po Americe — analogicky k europiu, svému lanthanoidovému protějšku pojmenovanému po Evropě.'],
    96: ['Curium', 'Curium je chemický prvek se značkou Cm a protonovým číslem 96. Tento transuranový radioaktivní prvek z řady aktinoidů byl pojmenován na počest Marie a Pierra Curieových, průkopníků výzkumu radioaktivity.'],
    97: ['Berkelium', 'Berkelium je chemický prvek se značkou Bk a protonovým číslem 97. Je to radioaktivní transuranový prvek z řady aktinoidů, pojmenovaný po městě Berkeley v Kalifornii, sídle Lawrence Berkeley National Laboratory, kde byl roku 1949 objeven.'],
    98: ['Kalifornium', 'Kalifornium je chemický prvek se značkou Cf a protonovým číslem 98. Tento radioaktivní prvek byl poprvé připraven roku 1950 v Lawrence Berkeley National Laboratory bombardováním curia částicemi alfa; je šestým vyrobeným transuranem a pojmenován je po Kalifornii.'],
    99: ['Einsteinium', 'Einsteinium je chemický prvek se značkou Es a protonovým číslem 99. Je to radioaktivní transuranový prvek z řady aktinoidů, sedmý transuran. Pojmenován je na počest Alberta Einsteina; objeven byl v troskách první vodíkové bomby roku 1952.'],
    100: ['Fermium', 'Fermium je chemický prvek se značkou Fm a protonovým číslem 100. Je to radioaktivní transuranový prvek z řady aktinoidů, nejtěžší prvek, který lze připravit neutronovým bombardováním lehčích prvků v makroskopickém množství.'],
    101: ['Mendelevium', 'Mendelevium je chemický prvek se značkou Md a protonovým číslem 101. Je to kovový radioaktivní transuranový prvek z řady aktinoidů, který se obvykle syntetizuje bombardováním einsteinia částicemi alfa. Pojmenován je po Dmitriji Mendělejevovi.'],
    102: ['Nobelium', 'Nobelium je chemický prvek se značkou No a protonovým číslem 102. Je pojmenováno na počest Alfreda Nobela, vynálezce dynamitu a zakladatele Nobelových cen. Je to radioaktivní kov, desátý transuranový prvek a předposlední člen řady aktinoidů.'],
    103: ['Lawrencium', 'Lawrencium je chemický prvek se značkou Lr a protonovým číslem 103. Je pojmenováno na počest Ernesta Lawrence, vynálezce cyklotronu — zařízení, kterým bylo objeveno mnoho umělých radioaktivních prvků.'],
    104: ['Rutherfordium', 'Rutherfordium je chemický prvek se značkou Rf a protonovým číslem 104. Je pojmenováno na počest novozélandského fyzika Ernesta Rutherforda. Jako syntetický prvek se v přírodě nevyskytuje a lze jej připravit pouze v laboratoři.'],
    105: ['Dubnium', 'Dubnium je chemický prvek se značkou Db a protonovým číslem 105. Je vysoce radioaktivní: nejstabilnější známý izotop ²⁶⁸Db má poločas asi 28 hodin, což velmi ztěžuje delší výzkum tohoto prvku.'],
    106: ['Seaborgium', 'Seaborgium je chemický prvek se značkou Sg a protonovým číslem 106. Je pojmenováno na počest amerického jaderného chemika Glenna T. Seaborga. Jako syntetický prvek jej lze vytvořit jen v laboratoři; v přírodě nebyl pozorován.'],
    107: ['Bohrium', 'Bohrium je chemický prvek se značkou Bh a protonovým číslem 107. Je pojmenováno na počest dánského fyzika Nielse Bohra. Jako syntetický prvek byl vytvořen pouze v laboratoři.'],
    108: ['Hassium', 'Hassium je chemický prvek se značkou Hs a protonovým číslem 108, pojmenovaný po německé spolkové zemi Hesensko. Je to syntetický prvek; nejstabilnější známý izotop ²⁶⁹Hs má poločas přibližně 9,7 sekundy.'],
    109: ['Meitnerium', 'Meitnerium je chemický prvek se značkou Mt a protonovým číslem 109. Je to mimořádně radioaktivní syntetický prvek (nevyskytuje se v přírodě, lze jej pouze vyrobit v laboratoři), pojmenovaný po rakouské fyzičce Lise Meitnerové.'],
    110: ['Darmstadtium', 'Darmstadtium je chemický prvek se značkou Ds a protonovým číslem 110. Je to mimořádně radioaktivní syntetický prvek, pojmenovaný po německém městě Darmstadt, kde byl objeven. Nejstabilnější známý izotop ²⁸¹Ds má poločas asi 10 sekund.'],
    111: ['Roentgenium', 'Roentgenium je chemický prvek se značkou Rg a protonovým číslem 111. Je to mimořádně radioaktivní syntetický prvek, který lze vytvořit jen v laboratoři; pojmenován je po Wilhelmu Röntgenovi, objeviteli rentgenového záření.'],
    112: ['Kopernicium', 'Kopernicium je chemický prvek se značkou Cn a protonovým číslem 112. Je to mimořádně radioaktivní syntetický prvek, který lze vytvořit pouze v laboratoři. Pojmenován je po astronomovi Mikuláši Koperníkovi.'],
    113: ['Nihonium', 'Nihonium je syntetický chemický prvek se značkou Nh a protonovým číslem 113. Je mimořádně radioaktivní; nejstabilnější známý izotop ²⁸⁶Nh má poločas asi 10 sekund. Pojmenován je po Japonsku (Nihon), kde byl objeven.'],
    114: ['Flerovium', 'Flerovium je supertěžký umělý chemický prvek se značkou Fl a protonovým číslem 114. Je to mimořádně radioaktivní syntetický prvek, pojmenovaný po Flerovově laboratoři jaderných reakcí v Dubně, kde byl roku 1998 objeven.'],
    115: ['Moscovium', 'Moscovium je syntetický chemický prvek se značkou Mc a protonovým číslem 115. Poprvé byl připraven roku 2003 společným týmem ruských a amerických vědců v Dubně; pojmenován je po Moskevské oblasti.'],
    116: ['Livermorium', 'Livermorium je syntetický supertěžký prvek se značkou Lv a protonovým číslem 116. Je to mimořádně radioaktivní prvek, který byl vytvořen pouze v laboratoři; pojmenován je po Lawrence Livermore National Laboratory.'],
    117: ['Tennessin', 'Tennessin je supertěžký umělý chemický prvek se značkou Ts a protonovým číslem 117. Je druhým nejtěžším známým prvkem a předposledním prvkem 7. periody periodické tabulky. Pojmenován je po americkém státě Tennessee.'],
    118: ['Oganesson', 'Oganesson je supertěžký umělý chemický prvek se značkou Og a protonovým číslem 118. Poprvé byl syntetizován roku 2002 v Dubně společným týmem ruských a amerických vědců. Pojmenován je po jaderném fyzikovi Juriji Oganesjanovi.'],
  },
};

    return [el.number, el];
  }));
  var zBySymbol = new Map(DB.map(function (el) {
    return [el.symbol, el.number];

      'alkali metal': '#e34948',
      'alkaline earth metal': '#eb6834',
      'transition metal': '#2a78d6',
      'post-transition metal': '#1baf7a',
      metalloid: '#eda100',
      'reactive nonmetal': '#008300',
      'noble gas': '#4a3aa7',
      lanthanide: '#e87ba4',
      actinide: '#9085e9',
      unknown: '#898781'
    },
    dark: {
      'alkali metal': '#e66767',
      'alkaline earth metal': '#d95926',
      'transition metal': '#3987e5',
      'post-transition metal': '#199e70',
      metalloid: '#c98500',
      'reactive nonmetal': '#008300',
      'noble gas': '#9085e9',
      lanthanide: '#e87ba4',
      actinide: '#6d5fc9',
      unknown: '#898781'
    }
  };
  var SURFACE = {
    light: '#fcfcfb',
    dark: '#1a1a19'
  };
  var TINT = {
    light: 0.16,
    dark: 0.22
  };
  function curTheme() {
    var t = document.documentElement.getAttribute('data-theme');
